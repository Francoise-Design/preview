<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Françoise Demo</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --text: #0a0a0a;
      --muted: #6d6a63;
      --accent: #8c43ff;
      --content: 1440px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .section {
      min-height: 100vh;
      padding: clamp(56px, 6vw, 104px) clamp(28px, 5.5vw, 106px) clamp(48px, 5vw, 88px);
      display: flex;
      align-items: center;
    }

    .wrap {
      width: min(100%, var(--content));
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 clamp(34px, 3.4vw, 56px);
      font-size: clamp(56px, 5.3vw, 102px);
      line-height: .95;
      letter-spacing: -0.065em;
      font-weight: 700;
    }

.video-shell {
  position: relative;
  width: 100%;
  /* aspect-ratio: 16 / 6.05;  <-- Удалите или закомментируйте эту строку */
  overflow: hidden;
  background: #fff;
}

.video-shell video {
  width: 100%;
  height: auto; /* <-- Замените 100% на auto */
  display: block;
  /* object-fit: cover;        <-- Можно удалить */
  /* object-position: center;  <-- Можно удалить */
}

    .footer-row {
      margin-top: clamp(28px, 2.4vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 1.16vw, 22px);
      line-height: 1;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 306px;
      min-height: 82px;
      padding: 20px 34px;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-size: clamp(18px, 1.2vw, 24px);
      line-height: 1;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 800;
      transition: transform .18s ease, opacity .18s ease;
    }

    .button:hover { transform: translateY(-2px); }
    .button:active { transform: translateY(0); opacity: .92; }

    @media (max-width: 900px) {
      .section { padding: 40px 22px 32px; }
      h1 { margin-bottom: 28px; }
      .video-shell { aspect-ratio: 16 / 8.2; }
      .footer-row { align-items: flex-start; flex-direction: column; }
      .button { width: 100%; min-width: 0; min-height: 68px; }
      .eyebrow { white-space: normal; line-height: 1.25; }
    }
  </style>
</head>
<body>
  <main class="section">
    <div class="wrap">
      <h1>Françoise Demo</h1>

      <div class="video-shell">
        <video autoplay muted loop playsinline preload="metadata" poster="Section.png" controls>
          <source src="demo.webm" type="video/webm" />
          Your browser does not support the video tag.
        </video>
      </div>

      <div class="footer-row">
        <p class="eyebrow">Interface Operations Infrastructure</p>
        <a class="button" href="Francoise_pitch.pdf" download>Download Pitch</a>
      </div>
    </div>
  </main>
</body>
</html>
