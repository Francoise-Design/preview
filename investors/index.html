<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Françoise Demo</title>

  <style>
    :root {
      --bg: #f6f6f4;
      --text: #0a0a0a;
      --muted: #6d6a63;
      --line: #d9d8d4;
      --accent: #9b43f7;
      --accent-hover: #832edb;
      --content: 980px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
    }

    .section {
      min-height: 100vh;
      padding: clamp(24px, 3vh, 40px) clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
    }

    .wrap {
      width: min(100%, var(--content));
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 clamp(18px, 2vh, 28px);
      font-size: clamp(42px, 4.3vw, 68px);
      line-height: 0.9;
      letter-spacing: -0.055em;
      font-weight: 700;
    }


.video-shell {
  position: relative;
  width: 100%;
  aspect-ratio: 1.6 / 1;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #fff;
}

.video-shell iframe {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 101%;
  height: 101%;
  transform: translate(-50%, -50%);
  display: block;
  border: 0;
}

    .footer-row {
      margin-top: clamp(18px, 2vh, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

.footer-copy {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  min-width: 0;
}

    .eyebrow,
    .email {
      margin: 0;
      color: var(--muted);
      font-size: clamp(12px, 0.85vw, 15px);
      line-height: 1.2;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .email {
      color: var(--text);
      letter-spacing: 0.03em;
      text-transform: none;
      text-decoration: none;
      white-space: nowrap;
    }

    .email:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 164px;
      min-height: 48px;
      padding: 12px 18px;
      border: 1px solid var(--accent);
      border-radius: 0;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0.075em;
      text-transform: uppercase;
      font-weight: 700;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-secondary {
      border-color: var(--text);
      background: transparent;
      color: var(--text);
    }

    .button-secondary:hover {
      background: var(--text);
      color: #fff;
    }

    @media (max-width: 900px) {
      .section {
        min-height: auto;
        padding: 36px 22px 44px;
      }

      .wrap {
        width: 100%;
      }

      h1 {
        margin-bottom: 22px;
      }

      .video-shell {
        aspect-ratio: 1.7 / 1;
      }

      .footer-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 22px;
        margin-top: 24px;
      }

      .footer-copy {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .buttons {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      .button {
        width: 100%;
        min-width: 0;
        min-height: 54px;
      }
    }
  </style>
</head>

<body>
  <main class="section">
    <div class="wrap">
      <h1>Françoise Demo</h1>

      <div class="video-shell">
        <iframe
          src="https://www.loom.com/embed/8e68017d26d74c2b990e30548e7fed07?hideEmbedTopBar=true&hide_title=true&hide_owner=true&hide_share=true"
          title="Françoise product demo"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen
        ></iframe>
      </div>

      <div class="footer-row">
        <div class="footer-copy">
          <p class="eyebrow">Interface Operations Infrastructure</p>
          <a class="email" href="mailto:ceo@francoise.design">ceo@francoise.design</a>
        </div>

        <div class="buttons">
          <a
            class="button button-secondary"
            href="Francoise_one-pager.pdf"
            target="_blank"
            rel="noopener"
          >
            View One-Pager
          </a>

          <a
            class="button"
            href="Francoise_pitch.pdf"
            download
          >
            Download Pitch
          </a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
